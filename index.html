<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0f14" />
  <title>ULTIMECIA War Room</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">U</div>
        <div>
          <strong>ULTIMECIA</strong>
          <span>WAR ROOM</span>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-footer">
        <div class="connection-dot" id="connectionDot"></div>
        <div>
          <span class="muted small">GitHub</span>
          <strong id="connectionLabel">Não sincronizado</strong>
        </div>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <div class="eyebrow" id="pageEyebrow">CENTRAL DE COMANDO</div>
          <h1 id="pageTitle">Visão Geral</h1>
        </div>
        <div class="top-actions">
          <span class="timestamp" id="lastSync">Nunca sincronizado</span>
          <button class="btn secondary" id="syncBtn">↻ Sincronizar GitHub</button>
        </div>
      </header>
      <section id="view"></section>
    </main>
  </div>

  <dialog id="modal">
    <form method="dialog" class="modal-card" id="modalForm">
      <div class="modal-header">
        <div>
          <div class="eyebrow" id="modalEyebrow">REGISTRO</div>
          <h2 id="modalTitle">Novo item</h2>
        </div>
        <button value="cancel" class="icon-btn" aria-label="Fechar">×</button>
      </div>
      <div id="modalFields"></div>
      <div class="modal-actions">
        <button value="cancel" class="btn secondary">Cancelar</button>
        <button value="default" class="btn primary" id="modalSave">Salvar</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="importFile" accept="application/json" hidden />
  <script src="app.js"></script>
</body>
</html>
